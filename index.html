<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的曲谱库</title>

<style>
body{
    margin:0;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC";
}

.header{
    background:#07c160;
    color:#fff;
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

.list{
    padding:10px;
}

.card{
    background:#fff;
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card img{
    width:100%;
    display:block;
}

.name{
    padding:12px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
🎵 我的曲谱库
</div>

<div class="list">

<div class="card">
成都.jpeg
<div class="name">成都</div>
</div>

<div class="card">
如愿1.jpeg
<div class="name">如愿</div>
</div>

<div class="card">
凤凰于飞.jpeg
<div class="name">凤凰于飞</div>
</div>

<div class="card">
夜上海.jpeg
<div class="name">夜上海</div>
</div>

<div class="card">
鸳鸯戏.jpeg
<div class="name">鸳鸯戏</div>
</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>我的曲谱库</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .header {
            position: sticky;
            top: 0;
            padding: 18px;
            background: #07c160;
            color: white;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .song {
            margin-bottom: 12px;
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .song a {
            display: block;
            padding: 18px;
            color: #333;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
        }

        .song a:active {
            background: #f0fff5;
        }

        .footer {
            padding: 20px;
            color: #888;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="header">
        🎵 我的曲谱库
    </div>

    <div class="container">

        <div class="song">
            ./成都.jpeg
                成都
            </a>
        </div>

        <div class="song">
            ./ruyuan.html
                如愿
            </a>
        </div>

        <div class="song">
            ./凤凰于飞.jpeg
                凤凰于飞
            </a>
        </div>

        <div class="song">
            ./夜上海.jpeg
                夜上海
            </a>
        </div>

        <div class="song">
            ./鸳鸯戏.jpeg
                鸳鸯戏
            </a>
        </div>

    </div>

    <div class="footer">
        共 5 首曲谱
    </div>

</body>

</html>
